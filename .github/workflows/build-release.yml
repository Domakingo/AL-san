name: Build Release APK

on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      release_tag:
        description: ''
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
      
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      
      - name: Create apikey.properties
        run: |
          echo "YOUTUBE_API_KEY=\"${{ secrets.YOUTUBE_API_KEY }}\"" > apikey.properties
          echo "SPOTIFY_API_KEY=\"${{ secrets.SPOTIFY_API_KEY }}\"" >> apikey.properties
      
      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > keystore.jks
      
      - name: Resolve Dependencies
        run: |
          # Retry logic for flaky JitPack
          for i in 1 2 3; do
            ./gradlew dependencies --refresh-dependencies && break
            echo "Retry $i..."
            sleep 30
          done
      
      - name: Build Release APK
        env:
          SIGNING_STORE_FILE: ${{ github.workspace }}/keystore.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease
      
      - name: Upload APK to Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v1
        with:
          files: app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AL-san-release
          path: app/build/outputs/apk/release/*.apk
          compression-level: 0
          retention-days: 30

      - name: Cleanup keystore
        if: always()
        run: rm -f keystore.jks apikey.properties
